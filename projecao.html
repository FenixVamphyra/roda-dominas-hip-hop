<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100b12"><title>Telão · Roda Domina’s</title>
<style>
:root{color-scheme:dark;--accent:#f4b24d;--bg:#100b12;--fg:#fff8ec;--font-title:Impact,'Arial Black',sans-serif;--font-body:Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden}body{display:grid;place-items:center}.stage{width:100%;height:100%;padding:4vh 5vw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3vh;background:radial-gradient(ellipse at 50% 15%,#472116 0%,#1a1018 52%,#09070b 100%)}.brand{font-size:clamp(14px,2vw,26px);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800}.title{font-family:var(--font-title);font-size:clamp(24px,4vw,54px);line-height:1.08;max-width:95vw;text-wrap:balance}.timer{font-size:min(34vw,48vh);font-weight:900;line-height:.92;letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 5px 30px #0008}.text{font-size:clamp(28px,6.4vw,86px);line-height:1.18;font-weight:800;max-width:92vw;text-wrap:balance;white-space:pre-wrap}.foot{font-size:clamp(12px,1.5vw,20px);color:#d8bda8;opacity:.82}.controls{position:fixed;right:12px;top:12px;display:flex;gap:8px;opacity:.14;transition:opacity .2s}.controls:hover,.controls:focus-within{opacity:1}.controls button,.controls select{background:#251820;color:#fff;border:1px solid #80604e;border-radius:9px;padding:8px;font-size:14px}.hidden{display:none!important}.timer-mode .title{font-size:clamp(20px,3vw,38px)}.timer-mode .text{font-size:clamp(14px,2vw,24px);font-weight:500}.blank .brand,.blank .title,.blank .timer,.blank .text{display:none}.blank .foot{display:block}.timer-mode .text:empty{display:none}@media(max-width:600px){.stage{padding:5vw;gap:4vh}.timer{font-size:min(36vw,35vh)}.title{font-size:clamp(22px,6vw,38px)}.text{font-size:clamp(24px,7vw,48px)}}
</style></head><body><main class="stage timer-mode" id="stage"><div class="brand">DOMINA’S · SEMANA DO HIP-HOP</div><div class="title" id="title">RODA DE CONVERSA</div><div class="timer" id="timer">03:00</div><div class="text" id="text"></div><div class="foot" id="foot">Tela pública · aguardando sincronização da mediadora</div></main>
<div class="controls" aria-label="Controles de visualização"><button id="zoomOut">A−</button><button id="zoomIn">A+</button><select id="screenFont" aria-label="Fonte do telão"><option value="Impact,'Arial Black',sans-serif">Título impactante</option><option value="Arial,sans-serif">Arial</option><option value="Georgia,serif">Georgia</option><option value="Verdana,sans-serif">Verdana</option></select><button id="fullscreen">⛶</button></div>
<script>
(function(){const $=id=>document.getElementById(id),stage=$('stage');let state={mode:'timer',title:'RODA DE CONVERSA · SEMANA DO HIP-HOP',text:'',seconds:180,running:false},zoom=1;let channel=null;function fmt(s){s=Math.max(0,Number(s)||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function render(d){state={...state,...d};$('title').textContent=state.title||'RODA DE CONVERSA';$('timer').textContent=fmt(state.seconds);$('text').textContent=state.text||'';stage.classList.toggle('timer-mode',state.mode==='timer');stage.classList.toggle('blank',state.mode==='blank');$('timer').classList.toggle('hidden',state.mode!=='timer');$('text').classList.toggle('hidden',!['text','prompt'].includes(state.mode)||!state.text);$('title').classList.toggle('hidden',state.mode==='text'&&!state.title);$('foot').textContent=state.mode==='timer'?'TEMPO DA RODA':state.mode==='prompt'?'TEMA PARA CONVERSA':state.mode==='text'?'MENSAGEM DA MEDIADORA':'TELA PÚBLICA';document.title=(state.mode==='timer'?'Cronômetro':state.title||'Telão')+' · Domina’s'}try{channel=new BroadcastChannel('dominas-public-screen-v1');channel.onmessage=e=>{if(e.data&&e.data.type==='dominas-projection-update')render(e.data)}}catch(e){}window.addEventListener('storage',e=>{if(e.key==='dominas-projection-state'&&e.newValue){try{render(JSON.parse(e.newValue))}catch(_){}}});try{const saved=localStorage.getItem('dominas-projection-state');if(saved)render(JSON.parse(saved))}catch(_){}$('zoomIn').onclick=()=>{zoom=Math.min(1.5,zoom+.1);stage.style.transform='scale('+zoom+')';stage.style.width=(100/zoom)+'%';stage.style.height=(100/zoom)+'%'};$('zoomOut').onclick=()=>{zoom=Math.max(.7,zoom-.1);stage.style.transform='scale('+zoom+')';stage.style.width=(100/zoom)+'%';stage.style.height=(100/zoom)+'%'};$('screenFont').onchange=e=>stage.style.setProperty('--font-title',e.target.value);$('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen?.();if(e.key==='+'||e.key==='=')$('zoomIn').click();if(e.key==='-')$('zoomOut').click()});})();
</script></body></html>
