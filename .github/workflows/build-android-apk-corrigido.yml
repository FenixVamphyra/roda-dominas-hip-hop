name: Build Roda Domina's Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-android-apk-corrigido.yml"
      - "index.html"
      - "icon-192.png"
      - "icon-512.png"
      - "manifest.webmanifest"
      - "projecao.html"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate Android wrapper project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/br/com/fenixvamphyra/rodadominas android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp icon-192.png icon-512.png manifest.webmanifest projecao.html android/app/src/main/assets/
          cat > android/settings.gradle <<'EOF2'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "RodaDominasAndroid"
          include(":app")
          EOF2
          cat > android/build.gradle <<'EOF2'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF2
          cat > android/app/build.gradle <<'EOF2'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'br.com.fenixvamphyra.rodadominas'
              compileSdk 35
              defaultConfig {
                  applicationId 'br.com.fenixvamphyra.rodadominas'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF2
          cat > android/app/src/main/AndroidManifest.xml <<'EOF2'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="Roda Domina's" android:hardwareAccelerated="true" android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF2
          cat > android/app/src/main/java/br/com/fenixvamphyra/rodadominas/MainActivity.java <<'EOF2'
          package br.com.fenixvamphyra.rodadominas;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
              private WebView webView;
              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  if (savedInstanceState != null) webView.restoreState(savedInstanceState);
                  else webView.loadUrl("file:///android_asset/index.html");
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }
              @Override protected void onSaveInstanceState(Bundle outState) {
                  if (webView != null) webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }
          }
          EOF2
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK size
        run: test "$(stat -c%s android/app/build/outputs/apk/debug/app-debug.apk)" -gt 100000
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: roda-dominas-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
